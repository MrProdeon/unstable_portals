<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Портальная лаборатория{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f5f9; --card: #fff; --text: #1d2030; --muted: #6b7088;
      --line: #e3e5ee; --accent: #5b3fd6;
      --low: #1f8a4c;      --low-bg: #def5e7;
      --medium: #b86e00;   --medium-bg: #fdf0d5;
      --critical: #c0262d; --critical-bg: #fde3e4;
      --closed: #5b6074;   --closed-bg: #e8e9ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14151c; --card: #1d1f2a; --text: #e8e9f2; --muted: #9a9fb8;
        --line: #2d3040; --accent: #9d86ff;
        --low: #5fd592;      --low-bg: #16382a;
        --medium: #f2b04a;   --medium-bg: #3d2f12;
        --critical: #ff7b80; --critical-bg: #43191c;
        --closed: #a4a9bf;   --closed-bg: #2a2d3b;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--line); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    header .wrap { display: flex; justify-content: space-between;
                   align-items: center; height: 60px; }
    header a { color: var(--text); text-decoration: none; font-weight: 600; }
    header nav a { margin-left: 18px; }
    header .admin-link { color: var(--muted); font-weight: 400; font-size: 14px; }
    main { padding: 28px 0 60px; }
    h1 { margin: 0 0 20px; font-size: 26px; }
    h2 { margin: 0 0 14px; font-size: 19px; }
    .card { background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; padding: 22px; margin-bottom: 20px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left;
             border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    tbody tr.clickable:hover { background: var(--bg); }
    td a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
             font-size: 13px; font-weight: 600; white-space: nowrap; }
    .badge.low { color: var(--low); background: var(--low-bg); }
    .badge.medium { color: var(--medium); background: var(--medium-bg); }
    .badge.critical { color: var(--critical); background: var(--critical-bg); }
    .badge.closed { color: var(--closed); background: var(--closed-bg); }
    .muted { color: var(--muted); }
    .back { display: inline-block; margin-bottom: 14px; color: var(--accent);
            text-decoration: none; }
    .grid { display: grid; gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
    .stat .label { color: var(--muted); font-size: 13px; }
    .stat .value { font-size: 20px; font-weight: 600; }
    .reco { border-left: 6px solid var(--line); }
    .reco.low { border-left-color: var(--low); }
    .reco.medium { border-left-color: var(--medium); }
    .reco.critical { border-left-color: var(--critical); }
    .reco.closed { border-left-color: var(--closed); }
    .reco .title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .score { font-size: 40px; font-weight: 700; line-height: 1; }
    .formula { background: var(--bg); border-radius: 8px; padding: 14px 16px;
               font-family: ui-monospace, monospace; font-size: 14px; }
    ul.rules { margin: 8px 0 0; padding-left: 20px; }
    .empty { text-align: center; padding: 40px 0; color: var(--muted); }
    .msg { padding: 12px 16px; border-radius: 10px; margin-bottom: 14px;
           border: 1px solid var(--line); font-weight: 500; }
    .msg.success { background: var(--low-bg); color: var(--low); }
    .msg.warning { background: var(--medium-bg); color: var(--medium); }
    .msg.error { background: var(--critical-bg); color: var(--critical); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a href="{% url 'portals:list' %}">🌀 Портальная лаборатория</a>
      <nav>
        <a class="admin-link" href="/admin/">Админка</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
